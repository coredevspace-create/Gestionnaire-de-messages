<style>
/* Layout: grande carte hero violette (titre + bouton), barre d'outils sticky, grille de cartes-messages. Thème unique sombre, aligné sur Vidify. */
:root{
  --bg:#09080e; --surface:#131020; --surface-2:#0c0a13; --line:#2a2342; --line-strong:#3a2f5c;
  --fg:#f5f3fc; --muted:#a29db8;
  --accent:#8b5cf6; --accent-soft:#a78bfa; --accent-2:#7dd3fc; --green:#4ade80; --on-accent:#ffffff;
  --ok:#4ade80; --danger:#f87171;
  --glow:rgba(139,92,246,.35);
  --card-grad:linear-gradient(140deg,#21173d 0%,#151026 45%,#100d1a 100%);
  --f-display:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;
  background:radial-gradient(500px 220px at 100% 100%,rgba(74,222,128,.10),transparent 70%),var(--card-grad);
  border:1px solid var(--line-strong);border-radius:28px;padding:clamp(22px,4vw,36px)}
.brand{display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font:700 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft)}
h1{font:800 clamp(30px,5vw,52px)/1.02 var(--f-display);margin:0;letter-spacing:-.035em;text-wrap:balance}
h1 span{background:linear-gradient(90deg,var(--accent-soft),var(--accent-2) 55%,var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;color:var(--muted);max-width:56ch}

.btn{font:600 14px/1 var(--f-body);border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);padding:12px 16px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,border-color .12s,background .12s}
.btn:hover{border-color:var(--accent-soft)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:700;box-shadow:0 8px 28px var(--glow)}
.btn.primary:hover{background:#9a6dff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:8px 11px;font-size:13px}

.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-block:12px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{flex:1 1 220px;min-width:0;position:relative}
.field label{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:700 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-soft);pointer-events:none}
.field input{padding-left:104px}
input,textarea{width:100%;font:15px/1.5 var(--f-body);color:var(--fg);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px}
input::placeholder,textarea::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 13px/1 var(--f-body);padding:10px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--muted);cursor:pointer;white-space:nowrap}
.chip b{font:600 11px var(--f-mono);margin-left:6px;opacity:.75}
.chip[aria-pressed="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--accent);box-shadow:0 6px 20px var(--glow)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--card-grad);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-strong);box-shadow:0 10px 40px rgba(139,92,246,.12)}
.card.flash{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.22)}
.card-top{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.tag{font:700 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);white-space:nowrap}
.card h3{font:800 19px/1.2 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.body{white-space:pre-wrap;word-wrap:break-word;color:#d9d5ea;font:14.5px/1.6 var(--f-body);max-height:220px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0}
.body mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--fg);border-radius:4px;padding:0 3px}
.card-actions{display:flex;gap:8px;align-items:center;margin-top:auto}
.card-actions .copy{flex:1;justify-content:center}
.copy.done{background:var(--green);color:#06210f;box-shadow:none}
.uses{font:500 11px var(--f-mono);color:var(--muted);margin-left:auto}
.confirm{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--danger)}

.empty{border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{font:600 18px var(--f-display);color:var(--fg);margin:0 0 6px}
.status{font:500 12px var(--f-mono);color:var(--muted);margin:0 0 12px}

dialog{border:1px solid var(--line-strong);background:var(--card-grad);color:var(--fg);border-radius:24px;padding:0;width:min(560px,calc(100vw - 32px));box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,5,10,.7);backdrop-filter:blur(4px)}
dialog form{display:flex;flex-direction:column;gap:14px;padding:20px}
dialog h2{font:600 20px var(--f-display);margin:0}
.lbl{display:flex;flex-direction:column;gap:6px;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea{min-height:180px;resize:vertical}
.hint{font:13px var(--f-body);color:var(--muted);text-transform:none;letter-spacing:0}
.hint code{font:12px var(--f-mono);color:var(--accent-2)}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px}
.err{color:var(--danger);font-size:13px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);font:600 14px var(--f-body);padding:10px 16px;border-radius:10px;transition:.2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="eyebrow">Prospection</div>
      <h1>Mes réponses <span>prêtes à copier</span></h1>
      <p class="lead">Trouve la réponse qui colle à ce que dit le client, copie et envoie.</p>
    </div>
    <button class="btn primary" id="addBtn" type="button">+ Nouveau message</button>
  </header>

  <div class="toolbar">
    <div class="row">
      <div class="field"><label for="search">Recherche</label><input id="search" type="search" placeholder="Cherche un message : ce que dit le client, un mot…" autocomplete="off"></div>
    </div>
    <div class="chips" id="chips" role="toolbar" aria-label="Filtrer par situation"></div>
  </div>

  <p class="status" id="status">Chargement de tes messages…</p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h2>Aucun message pour l'instant</h2>
    <p>Ajoute ta première réponse type avec « + Nouveau message ». Exemple : le client dit « c'est trop cher ».</p>
  </div>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Nouveau message</h2>
    <label class="lbl">Situation (ce que dit le client)
      <input id="fTitle" required maxlength="120" placeholder="Ex : « C'est trop cher »">
    </label>
    <label class="lbl">Catégorie
      <input id="fCat" list="cats" maxlength="40" placeholder="Ex : Objection prix, Relance, Premier contact">
      <datalist id="cats"></datalist>
    </label>
    <label class="lbl">Message
      <textarea id="fBody" required placeholder="Ton message…"></textarea>
    </label>
    <p class="err" id="fErr" hidden></p>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" id="cancelBtn">Annuler</button>
      <button class="btn primary" type="submit" id="saveBtn">Enregistrer</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>


<!-- ============ CONFIG : colle ici tes 2 clés Supabase ============ -->
<script>
  const SUPABASE_URL = "https://hljnbsxynipderdfekpa.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_fNxdubDnJK6mf6dikDe6mg_PyOX3TGd";
</script>
<!-- ================================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const grid = $("#grid"), empty = $("#empty"), status = $("#status"), chips = $("#chips");
  const dlg = $("#dlg"), form = $("#form");
  let sb = null, msgs = [], filter = "Tous", editingId = null, confirmId = null;

  const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fill = t => t;
  const toast = t => { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1600); };
  const setStatus = () => { status.textContent = `${msgs.length} message${msgs.length>1?"s":""} enregistré${msgs.length>1?"s":""}`; };

  function render(){
    const q = $("#search").value.trim().toLowerCase();
    const cats = {};
    msgs.forEach(m => { const c = m.category || "Sans catégorie"; cats[c] = (cats[c]||0)+1; });
    if (filter !== "Tous" && !cats[filter]) filter = "Tous";
    chips.innerHTML = ["Tous", ...Object.keys(cats).sort((a,b)=>a.localeCompare(b,"fr"))].map(c =>
      `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}<b>${c==="Tous"?msgs.length:cats[c]}</b></button>`).join("");
    $("#cats").innerHTML = Object.keys(cats).filter(c=>c!=="Sans catégorie").map(c=>`<option value="${esc(c)}">`).join("");

    const list = msgs.filter(m => (filter==="Tous" || (m.category||"Sans catégorie")===filter) &&
      (!q || (m.title+" "+m.body+" "+(m.category||"")).toLowerCase().includes(q)));
    empty.hidden = msgs.length > 0;
    grid.innerHTML = list.map(m => {
      const body = esc(fill(m.body)).replace(/\{pr[ée]nom\}/gi, s => `<mark>${s}</mark>`);
      const actions = confirmId === m.id
        ? `<div class="confirm">Supprimer ?<button class="btn sm danger" data-act="del-yes" data-id="${m.id}" type="button">Oui</button><button class="btn sm ghost" data-act="del-no" type="button">Non</button></div>`
        : `<button class="btn primary copy" data-act="copy" data-id="${m.id}" type="button">Copier</button>
           <button class="btn sm ghost" data-act="edit" data-id="${m.id}" type="button">Modifier</button>
           <button class="btn sm ghost danger" data-act="del" data-id="${m.id}" type="button" aria-label="Supprimer">✕</button>`;
      return `<article class="card">
        <div class="card-top">${m.category?`<span class="tag">${esc(m.category)}</span>`:""}<h3>${esc(m.title)}</h3></div>
        <pre class="body">${body}</pre>
        <div class="card-actions">${actions}</div>
        ${m.uses?`<span class="uses">copié ${m.uses}×</span>`:""}
      </article>`;
    }).join("");
    if (msgs.length && !list.length) grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>Rien ne correspond</h2><p>Essaie un autre mot ou la catégorie « Tous ».</p></div>`;
  }

  async function load(){
    const { data, error } = await sb.from("messages").select("*").order("created_at", { ascending: true });
    if (error) { status.textContent = "Impossible de charger les messages : vérifie tes clés Supabase et le script SQL."; return; }
    msgs = data; setStatus(); render();
  }

  async function copy(m, btn){
    const text = fill(m.body);
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy") }catch{} ta.remove();
      if (!ok) { toast("Copie impossible : sélectionne le texte à la main"); return; }
    }
    btn.textContent = "Copié ✓"; btn.classList.add("done");
    const card = btn.closest(".card"); card.classList.add("flash");
    setTimeout(() => { btn.textContent = "Copier"; btn.classList.remove("done"); card.classList.remove("flash"); }, 1300);
    toast("Message copié");
    sb.from("messages").update({ uses: (m.uses||0)+1 }).eq("id", m.id).then(()=>{});
  }

  grid.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const m = msgs.find(x => String(x.id) === b.dataset.id);
    switch (b.dataset.act) {
      case "copy": copy(m, b); break;
      case "edit": openDlg(m); break;
      case "del": confirmId = m.id; render(); break;
      case "del-no": confirmId = null; render(); break;
      case "del-yes": {
        confirmId = null;
        const { error } = await sb.from("messages").delete().eq("id", m.id);
        if (error) toast("Suppression impossible, réessaie"); else { toast("Message supprimé"); load(); }
      }
    }
  });
  chips.addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return; filter = c.dataset.cat; render(); });
  $("#search").addEventListener("input", render);

  function openDlg(m){
    if (!sb) { toast("Ajoute d'abord tes clés Supabase"); return; }
    editingId = m ? m.id : null;
    $("#dlgTitle").textContent = m ? "Modifier le message" : "Nouveau message";
    $("#fTitle").value = m ? m.title : ""; $("#fCat").value = m ? (m.category||"") : (filter!=="Tous"&&filter!=="Sans catégorie"?filter:"");
    $("#fBody").value = m ? m.body : ""; $("#fErr").hidden = true;
    dlg.showModal(); $("#fTitle").focus();
  }
  $("#addBtn").addEventListener("click", () => openDlg(null));
  $("#cancelBtn").addEventListener("click", () => dlg.close());
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const data = { title: $("#fTitle").value.trim(), category: $("#fCat").value.trim(), body: $("#fBody").value.trim() };
    if (!data.title || !data.body) return;
    $("#saveBtn").disabled = true;
    const { error } = editingId
      ? await sb.from("messages").update(data).eq("id", editingId)
      : await sb.from("messages").insert(data);
    $("#saveBtn").disabled = false;
    if (error) { $("#fErr").textContent = "Enregistrement impossible. Vérifie ta connexion et réessaie."; $("#fErr").hidden = false; return; }
    dlg.close(); toast(editingId ? "Message modifié" : "Message ajouté"); load();
  });

  render(); empty.hidden = true;

  if (!window.supabase || SUPABASE_URL.startsWith("COLLE") || SUPABASE_ANON_KEY.startsWith("COLLE")) {
    status.textContent = "Configuration manquante : colle ton URL et ta clé Supabase en bas du fichier index.html.";
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  load();
  // Temps réel : quand ton pote ajoute ou modifie un message, il apparaît chez toi sans recharger.
  sb.channel("messages-live").on("postgres_changes", { event: "*", schema: "public", table: "messages" }, () => load()).subscribe();
})();
</script>
</body>
</html>
